schema: spec-driven

context: |
  Project: Drone Lending System. Drones and accessories are loaned to student groups.
  The application replaces the paper note on the cabinet door and keeps a lasting history.

  Technology stack:
  - Backend: C#, ASP.NET Core 10 Web API
  - Persistence: Entity Framework Core, SQLite
  - Frontend: Angular, TypeScript
  - API: REST/JSON

  Architecture:
  - The application consists of an Angular frontend and an ASP.NET Core backend.
  - The frontend communicates exclusively with the backend REST API.
  - Business logic and validation must be implemented in the backend.
  - The frontend must not access the database directly.

  Development:
  - Backend code is located in /backend/DroneInventory.Api.
  - Frontend code is located in /frontend/drone-inventory-ui.
  - OpenSpec is the source of truth for requirements.

  Domain concepts: Drone, StudentGroup, Loan, LoanItem. A StudentGroup has members
  (StudentGroupMember, name only); one member can be its group leader.
  Use these terms everywhere. Do not introduce synonyms.

  Domain rules:
  - A drone can only have one active loan.
  - Only available drones can be loaned.
  - Returning a loan makes the drone available again.
  - Accessory quantities must not be negative.
  - Returned loans stay stored and are never deleted, except on purpose: a student group or a
    drone is deleted for good from the trash together with its history, the history is deleted,
    or the general reset deletes it.
  - Deleting a student group or a drone moves it into the trash; with an active loan it is not
    deleted. In the trash it cannot loan or be loaned or changed, and its name stays taken.
  - Batteries and propellers are tracked as quantities only.
  - A drone with a reported defect is Defective and cannot be loaned until it is repaired.
  - Otherwise drone availability follows from the active loan and is never entered by a user.
  - A return records the returned quantities; missing parts stay visible in the history.
  - A member name is unique within its group, ignoring case; a group has at most one leader,
    who is one of its own members. Loans belong to the group, not to a member.

  Out of scope: login, user accounts and roles; individual batteries with their own
  identity. Damage management, return differences, reservations, statistics and the
  history export were moved into scope on 2026-11-12.

rules:
  proposal:
    - State explicitly what is out of scope.
  specs:
    - Use Given/When/Then scenarios for acceptance criteria.
    - Describe behavior, not implementation details.
  tasks:
    - Keep tasks small, independent and individually testable.
    - Every Given/When/Then scenario needs a test task.
